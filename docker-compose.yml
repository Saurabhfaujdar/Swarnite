version: '3.8'

# ─────────────────────────────────────────────────────────────
# JewelERP Docker Compose — Base Configuration
# ─────────────────────────────────────────────────────────────
# Usage:
#   Local dev DB only:     docker compose up db
#   Staging:               docker compose --env-file deploy/staging.env up
#   Production:            docker compose --env-file deploy/production.env up
# ─────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL Database ──────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jewelerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: jewelerp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jewelerp']
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── JewelERP Application ────────────────────────────────
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: []   # override with --env-file for staging/production
    environment:
      DATABASE_URL: postgresql://jewelerp:${POSTGRES_PASSWORD:-changeme}@db:5432/jewelerp
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev-refresh-secret-change-me}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-strict}
      TRUST_PROXY: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVE_STATIC: true
      APP_VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/ready']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Nginx Reverse Proxy + SSL Termination ────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Volume-mount per-environment frontend config (overrides baked-in config.js)
      # - ./deploy/config.staging.js:/app/dist/config.js:ro
      # SSL certs (uncomment when ready):
      # - ./certs/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      # - ./certs/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ─── Database Backup Sidecar ──────────────────────────────
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: jewelerp
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATABASE: jewelerp
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ['sh', '-c', 'crond -f -d 8']
    command: []
    profiles:
      - backup   # only starts with: docker compose --profile backup up

volumes:
  pgdata:
  backups:
